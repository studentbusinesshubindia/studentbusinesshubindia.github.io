<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product & Customer Management</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .img-preview-thumb {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-light p-3 p-md-5">

<div class="container bg-white p-4 rounded shadow-sm">
  <h2 class="mb-4 text-center text-primary">उत्पादन आणि ग्राहक नोंदणी</h2>

  <!-- Owner Form -->
  <form id="ownerStep1Form" class="mb-4">
    <h5>मालकाची माहिती</h5>
    <div class="row g-3">
      <div class="col-md-6">
        <input type="text" name="ownerName" class="form-control" placeholder="मालकाचे नाव" required>
      </div>
      <div class="col-md-6">
        <input type="text" name="shopName" class="form-control" placeholder="दुकानाचे नाव" required>
      </div>
    </div>
  </form>

  <hr>

  <!-- Student Form -->
  <form id="studentForm" class="mb-4">
    <h5>विद्यार्थ्याची माहिती</h5>
    <div class="row g-3">
      <div class="col-md-6">
        <input type="text" name="studentName" class="form-control" placeholder="विद्यार्थ्याचे नाव" required>
      </div>
      <div class="col-md-6">
        <input type="text" name="studentRoll" class="form-control" placeholder="रोल नंबर" required>
      </div>
    </div>
  </form>

  <hr>

  <!-- Customer Form -->
  <form id="addCustForm" class="mb-4">
    <h5>ग्राहकाची माहिती</h5>
    <div class="row g-3">
      <div class="col-md-6">
        <input type="text" name="custName" class="form-control" placeholder="ग्राहकाचे नाव" required>
      </div>
      <div class="col-md-6">
        <input type="tel" name="custPhone" class="form-control" placeholder="फोन नंबर" required>
      </div>
    </div>
  </form>

  <hr>

  <!-- Product Form -->
  <form id="productInputForm" class="mb-4" onsubmit="event.preventDefault(); addProductToList();">
    <h5>उत्पादन जोडा</h5>
    <div class="row g-3">
      <div class="col-md-3">
        <input type="text" id="prodName" class="form-control" placeholder="उत्पादनाचे नाव" required>
      </div>
      <div class="col-md-2">
        <input type="number" step="0.01" id="prodMRP" class="form-control" placeholder="MRP (₹)" required>
      </div>
      <div class="col-md-2">
        <input type="number" step="0.01" id="prodSelling" class="form-control" placeholder="विक्री किंमत (₹)" required>
      </div>
      <div class="col-md-2">
        <input type="number" id="prodQty" class="form-control" placeholder="नग (Qty)" required>
      </div>
      <div class="col-md-3">
        <input type="file" id="prodImg" class="form-control" accept="image/*" onchange="convertImageToBase64(this)">
      </div>
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-secondary">
        <i class="fa-solid fa-plus me-1"></i> यादीत जोडा
      </button>
    </div>
  </form>

  <!-- Products Table -->
  <div class="table-responsive mb-4">
    <table class="table table-bordered align-middle" id="productsTable">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>फोटो</th>
          <th>उत्पादन</th>
          <th>MRP</th>
          <th>विक्री किंमत</th>
          <th>नग</th>
          <th>एकूण</th>
          <th>कृती</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="8" class="text-center text-muted">अजून कोणतेही उत्पादन जोडलेले नाही.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Summary & Save Button -->
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <p class="mb-1"><strong>एकूण नग:</strong> <span id="totalProductsCount">0</span></p>
      <p class="mb-0"><strong>एकूण मूल्य:</strong> ₹<span id="totalStockValue">0.00</span></p>
    </div>
    <div>
      <button type="button" class="btn btn-success btn-lg" id="saveBtn" onclick="saveCustomerAndResetForm()">
        <span class="spinner-border spinner-border-sm d-none" id="btnSaveSpinner" role="status" aria-hidden="true"></span>
        <span id="btnSaveText"><i class="fa-solid fa-floppy-disk me-1"></i> Save All & Complete</span>
      </button>
    </div>
  </div>
</div>

<script>
  // Updated Google Apps Script Execution URL
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzWfrQg4s5ZWEqTi_VjTl_W2U_saTxTZrLxhCPREX-v390Dc79bL42sykaQZHzFBvvEHw/exec';

  let productsList = [];
  let currentImageBase64 = "";

  // Convert uploaded image to Base64
  function convertImageToBase64(input) {
      if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
              currentImageBase64 = e.target.result;
          };
          reader.readAsDataURL(input.files[0]);
      }
  }

  // Add Product to Array
  function addProductToList() {
      const name = document.getElementById('prodName').value;
      const mrp = parseFloat(document.getElementById('prodMRP').value) || 0;
      const selling = parseFloat(document.getElementById('prodSelling').value) || 0;
      const qty = parseInt(document.getElementById('prodQty').value) || 0;
      const total = selling * qty;

      const product = {
          id: Date.now(),
          name: name,
          mrp: mrp,
          selling: selling,
          qty: qty,
          total: total,
          img: currentImageBase64 || "https://via.placeholder.com/50"
      };

      productsList.push(product);
      renderTable();

      // Reset Product Input Form
      document.getElementById('productInputForm').reset();
      currentImageBase64 = "";
  }

  // Render Table
  function renderTable() {
      const tbody = document.querySelector('#productsTable tbody');
      tbody.innerHTML = '';

      if (productsList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">अजून कोणतेही उत्पादन जोडलेले नाही.</td></tr>`;
          updateSummary();
          return;
      }

      let totalProductsCount = 0;
      let totalStockValue = 0;

      productsList.forEach((product, index) => {
          totalProductsCount += product.qty;
          totalStockValue += product.total;

          const tr = document.createElement('tr');
          tr.innerHTML = `
              <td>${index + 1}</td>
              <td><img src="${product.img}" class="img-preview-thumb" alt="Product Image"></td>
              <td>${product.name}</td>
              <td>₹${product.mrp.toFixed(2)}</td>
              <td>₹${product.selling.toFixed(2)}</td>
              <td>${product.qty}</td>
              <td>₹${product.total.toFixed(2)}</td>
              <td>
                  <button class="btn btn-danger btn-sm" onclick="removeProduct(${product.id})">
                      <i class="fa-solid fa-trash"></i>
                  </button>
              </td>
          `;
          tbody.appendChild(tr);
      });

      document.getElementById('totalProductsCount').innerText = totalProductsCount;
      document.getElementById('totalStockValue').innerText = totalStockValue.toFixed(2);
  }

  // Remove Product from List
  function removeProduct(id) {
      productsList = productsList.filter(item => item.id !== id);
      renderTable();
  }

  // Update Summary Counts
  function updateSummary() {
      document.getElementById('totalProductsCount').innerText = "0";
      document.getElementById('totalStockValue').innerText = "0.00";
  }

  // Helper function to toggle button loading state
  function toggleLoading(btn, spinner, btnText, isLoading, textContent) {
      if (isLoading) {
          btn.disabled = true;
          spinner.classList.remove('d-none');
          btnText.innerHTML = textContent;
      } else {
          btn.disabled = false;
          spinner.classList.add('d-none');
          btnText.innerHTML = textContent;
      }
  }

  // Final Step: Save All & Complete
  function saveCustomerAndResetForm() {
      if (productsList.length === 0) {
          alert("कृपया कमीत कमी एक उत्पादन जोडा!");
          return;
      }

      const saveBtn = document.getElementById('saveBtn');
      const spinner = document.getElementById('btnSaveSpinner');
      const btnText = document.getElementById('btnSaveText');

      toggleLoading(saveBtn, spinner, btnText, true, 'सेव्ह होत आहे...');

      const custForm = document.getElementById('addCustForm');
      const formData = new FormData(custForm);

      formData.append('type', 'Customer Products');
      formData.append('products', JSON.stringify(productsList));

      fetch(SCRIPT_URL, { method: 'POST', body: formData })
          .then(res => res.json())
          .then(data => {
              alert("सर्व माहिती आणि उत्पादने यशस्वीरीत्या सेव्ह झाली आहेत!");
              resetAllForms();
          })
          .catch(err => {
              alert("माहिती सेव्ह झाली आहे!");
              resetAllForms();
          })
          .finally(() => {
              toggleLoading(saveBtn, spinner, btnText, false, '<i class="fa-solid fa-floppy-disk me-1"></i> Save All & Complete');
          });
  }

  // Reset Everything
  function resetAllForms() {
      document.getElementById('ownerStep1Form').reset();
      document.getElementById('studentForm').reset();
      document.getElementById('addCustForm').reset();
      document.getElementById('productInputForm').reset();
      
      productsList = [];
      currentImageBase64 = "";
      renderTable();
  }
</script>
</body>
</html>
