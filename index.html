<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product & Customer Management</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .img-preview-thumb {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-light p-3 p-md-5">

<div class="container bg-white p-4 rounded shadow-sm">
  <h2 class="mb-4 text-center text-primary">उत्पादन आणि ग्राहक नोंदणी</h2>

  <form id="mainRegistrationForm" onsubmit="event.preventDefault(); saveCustomerAndResetForm();">
    <!-- Owner Section -->
    <h5>मालकाची माहिती</h5>
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <input type="text" id="ownerName" name="ownerName" class="form-control" placeholder="मालकाचे नाव" required>
      </div>
      <div class="col-md-6">
        <input type="text" id="shopName" name="shopName" class="form-control" placeholder="दुकानाचे नाव" required>
      </div>
    </div>

    <hr>

    <!-- Student Section -->
    <h5>विद्यार्थ्याची माहिती</h5>
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <input type="text" id="studentName" name="studentName" class="form-control" placeholder="विद्यार्थ्याचे नाव" required>
      </div>
      <div class="col-md-6">
        <input type="text" id="studentRoll" name="studentRoll" class="form-control" placeholder="रोल नंबर" required>
      </div>
    </div>

    <hr>

    <!-- Customer Section -->
    <h5>ग्राहकाची माहिती</h5>
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <input type="text" id="custName" name="custName" class="form-control" placeholder="ग्राहकाचे नाव" required>
      </div>
      <div class="col-md-6">
        <input type="tel" id="custPhone" name="custPhone" class="form-control" placeholder="फोन नंबर" required>
      </div>
    </div>

    <hr>

    <!-- Product Input Section -->
    <h5>उत्पादन जोडा</h5>
    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <input type="text" id="prodName" class="form-control" placeholder="उत्पादनाचे नाव">
      </div>
      <div class="col-md-2">
        <input type="number" step="0.01" id="prodMRP" class="form-control" placeholder="MRP (₹)">
      </div>
      <div class="col-md-2">
        <input type="number" step="0.01" id="prodSelling" class="form-control" placeholder="विक्री किंमत (₹)">
      </div>
      <div class="col-md-2">
        <input type="number" id="prodQty" class="form-control" placeholder="नग (Qty)">
      </div>
      <div class="col-md-3">
        <input type="file" id="prodImg" class="form-control" accept="image/*" onchange="convertImageToBase64(this)">
      </div>
    </div>
    <div class="mb-4">
      <button type="button" class="btn btn-secondary" onclick="addProductToList()">
        <i class="fa-solid fa-plus me-1"></i> यादीत जोडा
      </button>
    </div>

    <!-- Products Table -->
    <div class="table-responsive mb-4">
      <table class="table table-bordered align-middle" id="productsTable">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>फोटो</th>
            <th>उत्पादन</th>
            <th>MRP</th>
            <th>विक्री किंमत</th>
            <th>नग</th>
            <th>एकूण</th>
            <th>कृती</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="8" class="text-center text-muted">अजून कोणतेही उत्पादन जोडलेले नाही.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Summary & Save Button -->
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <p class="mb-1"><strong>एकूण नग:</strong> <span id="totalProductsCount">0</span></p>
        <p class="mb-0"><strong>एकूण मूल्य:</strong> ₹<span id="totalStockValue">0.00</span></p>
      </div>
      <div>
        <button type="submit" class="btn btn-success btn-lg" id="saveBtn">
          <span class="spinner-border spinner-border-sm d-none" id="btnSaveSpinner" role="status" aria-hidden="true"></span>
          <span id="btnSaveText"><i class="fa-solid fa-floppy-disk me-1"></i> Save All & Complete</span>
        </button>
      </div>
    </div>
  </form>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwphmiSiBDxsEqRTqjXN1i7hmhtaZVsdff2WNsHfwK4U6uX0fYibk5Uggzz0AeDC1uWYQ/exec';

  let productsList = [];
  let currentImageBase64 = "";

  // Convert uploaded image to Base64
  function convertImageToBase64(input) {
      if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
              currentImageBase64 = e.target.result;
          };
          reader.readAsDataURL(input.files[0]);
      }
  }

  // Add Product to Table
  function addProductToList() {
      const name = document.getElementById('prodName').value.trim();
      const mrp = parseFloat(document.getElementById('prodMRP').value) || 0;
      const selling = parseFloat(document.getElementById('prodSelling').value) || 0;
      const qty = parseInt(document.getElementById('prodQty').value) || 0;

      if (!name || qty <= 0) {
          alert("कृपया उत्पादनाचे नाव आणि नग (Qty) योग्यरीत्या भरा!");
          return;
      }

      const product = {
          id: Date.now(),
          name: name,
          mrp: mrp,
          selling: selling,
          qty: qty,
          total: selling * qty,
          img: currentImageBase64 || "https://via.placeholder.com/50"
      };

      productsList.push(product);
      renderTable();

      // Reset Product Input Fields
      document.getElementById('prodName').value = '';
      document.getElementById('prodMRP').value = '';
      document.getElementById('prodSelling').value = '';
      document.getElementById('prodQty').value = '';
      document.getElementById('prodImg').value = '';
      currentImageBase64 = "";
  }

  // Render Table
  function renderTable() {
      const tbody = document.querySelector('#productsTable tbody');
      tbody.innerHTML = '';

      if (productsList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">अजून कोणतेही उत्पादन जोडलेले नाही.</td></tr>`;
          updateSummary();
          return;
      }

      let totalProductsCount = 0;
      let totalStockValue = 0;

      productsList.forEach((product, index) => {
          totalProductsCount += product.qty;
          totalStockValue += product.total;

          const tr = document.createElement('tr');
          tr.innerHTML = `
              <td>${index + 1}</td>
              <td><img src="${product.img}" class="img-preview-thumb" alt="Product Image"></td>
              <td>${product.name}</td>
              <td>₹${product.mrp.toFixed(2)}</td>
              <td>₹${product.selling.toFixed(2)}</td>
              <td>${product.qty}</td>
              <td>₹${product.total.toFixed(2)}</td>
              <td>
                  <button type="button" class="btn btn-danger btn-sm" onclick="removeProduct(${product.id})">
                      <i class="fa-solid fa-trash"></i>
                  </button>
              </td>
          `;
          tbody.appendChild(tr);
      });

      document.getElementById('totalProductsCount').innerText = totalProductsCount;
      document.getElementById('totalStockValue').innerText = totalStockValue.toFixed(2);
  }

  // Remove Product
  function removeProduct(id) {
      productsList = productsList.filter(item => item.id !== id);
      renderTable();
  }

  // Update Summary
  function updateSummary() {
      document.getElementById('totalProductsCount').innerText = "0";
      document.getElementById('totalStockValue').innerText = "0.00";
  }

  // Toggle Loading Button
  function toggleLoading(isLoading) {
      const saveBtn = document.getElementById('saveBtn');
      const spinner = document.getElementById('btnSaveSpinner');
      const btnText = document.getElementById('btnSaveText');

      if (isLoading) {
          saveBtn.disabled = true;
          spinner.classList.remove('d-none');
          btnText.innerHTML = 'सेव्ह होत आहे...';
      } else {
          saveBtn.disabled = false;
          spinner.classList.add('d-none');
          btnText.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Save All & Complete';
      }
  }

  // Submit All Data
  function saveCustomerAndResetForm() {
      if (productsList.length === 0) {
          alert("कृपया कमीत कमी एक उत्पादन यादीत जोडा!");
          return;
      }

      toggleLoading(true);

      const mainForm = document.getElementById('mainRegistrationForm');
      const formData = new FormData(mainForm);

      formData.append('type', 'Customer Products');
      formData.append('products', JSON.stringify(productsList));

      fetch(SCRIPT_URL, { method: 'POST', body: formData })
          .then(res => res.json())
          .then(data => {
              alert("सर्व माहिती आणि उत्पादने यशस्वीरीत्या सेव्ह झाली आहेत!");
              resetAll();
          })
          .catch(err => {
              alert("माहिती सेव्ह झाली आहे!");
              resetAll();
          })
          .finally(() => {
              toggleLoading(false);
          });
  }

  // Reset Form and List
  function resetAll() {
      document.getElementById('mainRegistrationForm').reset();
      productsList = [];
      currentImageBase64 = "";
      renderTable();
  }
</script>
</body>
</html>
